<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Error 404 | Eidos</title>
  <meta name="description" content="Página no encontrada. Vuelve a la página principal de Eidos o consigue las novelas en Amazon." />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="assets/images/favicon.png" />

  <style>
    :root {
      --deep: #050608;
      --gold: #c9a84c;
      --gold-soft: #e1c56a;
      --text: #f1ead7;
      --muted: #c9bea2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Josefin Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(5, 6, 8, 0.78), rgba(5, 6, 8, 0.94)),
        url("assets/images/header-bg.webp") center/cover no-repeat;
    }

    .error-page {
      min-height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 0.85fr) minmax(360px, 1.15fr);
      gap: clamp(32px, 6vw, 72px);
      align-items: center;
      padding: clamp(28px, 6vw, 70px);
      overflow: hidden;
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-wrap img {
      width: min(420px, 38vw);
      max-height: 82vh;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(201, 168, 76, 0.25));
    }

    .content {
      max-width: 720px;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 0.82rem;
      margin-bottom: 22px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4rem, 9vw, 8rem);
      line-height: 0.9;
      margin: 0 0 24px;
      color: var(--gold);
      font-weight: 600;
    }

    h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2rem, 4.2vw, 3.8rem);
      line-height: 1.05;
      font-weight: 400;
      margin: 0 0 24px;
    }

    p {
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      line-height: 1.75;
      margin: 0 0 34px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-start;
    }

    .buy-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      min-width: 230px;
      padding: 13px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      line-height: 1;
      transition: all 0.25s ease;
    }

    .btn-home {
      width: min(100%, 380px);
      background: var(--gold);
      color: #050608;
      border: 1px solid var(--gold);
      font-weight: 600;
    }

    .btn-buy {
      color: var(--text);
      border: 1px solid rgba(201, 168, 76, 0.72);
      background: rgba(201, 168, 76, 0.08);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-home:hover {
      background: var(--gold-soft);
      border-color: var(--gold-soft);
    }

    .btn-buy:hover {
      background: var(--gold);
      color: #050608;
    }

    @media (max-width: 860px) {
      body {
        background:
          linear-gradient(rgba(5, 6, 8, 0.72), rgba(5, 6, 8, 0.96)),
          url("assets/images/header-bg.webp") center/cover no-repeat;
      }

      .error-page {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 30px 22px 44px;
        text-align: center;
      }

      .cover-wrap {
        order: 1;
      }

      .content {
        order: 2;
        margin: 0 auto;
      }

      .cover-wrap img {
        width: min(330px, 86vw);
        max-height: 48vh;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        margin-bottom: 16px;
      }

      h1 {
        font-size: clamp(3.4rem, 17vw, 5.4rem);
        margin-bottom: 16px;
      }

      h2 {
        font-size: clamp(1.7rem, 9vw, 2.6rem);
        margin-bottom: 18px;
      }

      p {
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 28px;
      }

      .buttons {
        align-items: center;
      }

      .btn-home {
        width: min(100%, 360px);
      }

      .buy-row {
        justify-content: center;
        width: 100%;
      }

      .btn-buy {
        min-width: min(100%, 260px);
      }
    }

    @media (max-width: 520px) {
      .error-page {
        padding: 24px 18px 38px;
      }

      .cover-wrap img {
        width: min(300px, 92vw);
        max-height: 44vh;
      }

      .buy-row {
        flex-direction: column;
        align-items: center;
      }

      .btn,
      .btn-buy,
      .btn-home {
        width: min(100%, 340px);
        min-width: 0;
      }
    }

    @media (max-height: 720px) and (max-width: 860px) {
      .cover-wrap img {
        max-height: 38vh;
      }

      h1 {
        font-size: clamp(3rem, 14vw, 4.6rem);
      }

      h2 {
        font-size: clamp(1.5rem, 7vw, 2.2rem);
      }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="cover-wrap">
        <img class="book-img" src="https://www.eidoslibro.com/assets/images/eidoscover-both.webp" alt="Portada del libro EIDOS de Felden Vareth" loading="eager">
    </div>

    <section class="content">
      <div class="eyebrow">Eidos · Página no encontrada</div>

      <h1>Error 404</h1>

      <h2>Esta página se ha perdido en Eidos.</h2>

      <p>
        La dirección solicitada no existe o ha cambiado. Puedes volver a la página principal
        de Eidos o continuar explorando sus dos volúmenes en Amazon.
      </p>

      <div class="buttons">
        <a class="btn btn-home" href="https://www.eidoslibro.com/index.html">Volver a Eidos</a>

        <div class="buy-row">
          <a class="btn btn-buy" href="https://www.amazon.es/dp/B0FCR5ZPBJ" target="_blank" rel="noopener">Comprar Eidos</a>
          <a class="btn btn-buy" href="https://www.amazon.es/dp/B0G8HLFJXT" target="_blank" rel="noopener">Comprar Eidos Relatos</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
