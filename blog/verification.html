<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmission Verified · EIDOS</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <meta name="theme-color" content="#050608">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/blog.css">

  <style>
    :root{
      --gold:#c9a84c;
      --bg:#050608;
      --text:#e8e0d0;
      --muted:#7a7060;
      --ff-serif:'Cormorant Garamond', Georgia, serif;
      --ff-sans:'Josefin Sans', system-ui, sans-serif;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:var(--ff-sans);
      overflow-x:hidden;
    }

    .bg-layer{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at top, rgba(201,168,76,.08), transparent 55%),
        radial-gradient(circle at bottom right, rgba(201,168,76,.05), transparent 40%),
        #050608;
    }

    .grid-lines{
      position:fixed;
      inset:0;
      z-index:0;
      opacity:.035;
      pointer-events:none;
      background-image:
        linear-gradient(var(--gold) 1px, transparent 1px),
        linear-gradient(90deg, var(--gold) 1px, transparent 1px);
      background-size:60px 60px;
      mask-image:radial-gradient(circle at center, black 35%, transparent 100%);
    }

    .particles{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    .particle{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:var(--gold);
      opacity:0;
      animation:float-up var(--dur,8s) var(--delay,0s) ease-in infinite;
    }

    @keyframes float-up{
      0%{
        transform:translateY(0) translateX(0);
        opacity:0;
      }

      10%{
        opacity:var(--op,.4);
      }

      90%{
        opacity:var(--op,.4);
      }

      100%{
        transform:translateY(-80vh) translateX(var(--drift,20px));
        opacity:0;
      }
    }

    .blog-nav{
      position:fixed;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:min(calc(100% - 48px), 1280px);
      z-index:20;
      background:rgba(5,6,8,.82);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(201,168,76,.08);
    }

    .nav-inner{
      width:100%;
      max-width:1180px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:18px 0;
      position:relative;
    }

    .nav-toggle{
      display:none;
      align-items:center;
      justify-content:center;
      width:42px;
      height:42px;
      background:transparent;
      border:1px solid rgba(201,168,76,.18);
      border-radius:999px;
      color:#e8e0d0;
      font-size:1.35rem;
      line-height:1;
      cursor:pointer;
      font-family:var(--ff-sans);
    }

    .shell{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:140px 24px 80px;
    }

    .card{
      width:100%;
      max-width:620px;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(201,168,76,.14);
      backdrop-filter:blur(12px);
      padding:72px 60px;
      text-align:center;
      box-shadow:
        0 0 60px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .icon{
      width:84px;
      height:84px;
      margin:0 auto 36px;
      border-radius:50%;
      border:1px solid rgba(201,168,76,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--gold);
      font-size:2rem;
      box-shadow:0 0 30px rgba(201,168,76,.15);
    }

    .kicker{
      font-size:.72rem;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--gold);
      margin-bottom:22px;
    }

    h1{
      font-family:var(--ff-serif);
      font-size:clamp(2.4rem,5vw,3.4rem);
      font-weight:600;
      line-height:1.05;
      margin-bottom:26px;
    }

    h1 em{
      color:var(--gold);
      font-style:italic;
      font-weight:600;
    }

    .body-text{
      max-width:480px;
      margin:0 auto 42px;
      font-size:.95rem;
      line-height:1.9;
      color:var(--muted);
    }

    .body-text strong{
      color:var(--text);
      font-weight:500;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:15px 38px;
      border-radius:999px;
      background:linear-gradient(135deg, rgba(201,168,76,.96), rgba(155,122,42,.92));
      color:#080808;
      text-decoration:none;
      font-size:.72rem;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
      transition:.25s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.08);
    }

    .footer{
      position:relative;
      z-index:1;
      text-align:center;
      padding:0 24px 40px;
      font-size:.72rem;
      color:rgba(122,112,96,.55);
    }

    .footer a{
      color:rgba(201,168,76,.65);
      text-decoration:none;
    }

    @media (max-width:700px){
      .blog-nav{
        width:calc(100% - 28px);
      }

      .nav-inner{
        padding:14px 0;
      }

      .nav-toggle{
        display:flex;
      }

      .nav-links{
        position:absolute;
        top:calc(100% + 12px);
        left:50%;
        transform:translateX(-50%);
        width:min(100%, 420px);
        display:none;
        flex-direction:column;
        align-items:center;
        text-align:center;
        gap:0;
        padding:20px 18px;
        background:rgba(5,6,8,.96);
        border:1px solid rgba(201,168,76,.12);
        backdrop-filter:blur(14px);
        box-shadow:0 24px 60px rgba(0,0,0,.35);
      }

      .nav-links.active{
        display:flex;
      }

      .nav-links a{
        width:100%;
        padding:13px 0;
      }

      .card{
        padding:54px 28px;
      }

      .body-text{
        font-size:.88rem;
      }
    }
  </style>
</head>

<body>

  <div class="bg-layer" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <nav class="blog-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="brand" href="indexeng.html" aria-label="Eidos Blog">
        <span class="brand-word">EIDOS</span>
        <span class="brand-sub">BLOG</span>
      </a>

      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        ☰
      </button>

      <div class="nav-links">
        <a href="../indexeng.html">Eidos</a>
    
      </div>
    </div>
  </nav>

  <main class="shell">
    <div class="card">
      <div class="icon">✓</div>

      <p class="kicker">VERIFICATION COMPLETED</p>

      <h1>Transmission <em>activated</em></h1>

      <p class="body-text">
        Your email address has been successfully verified.
        <br><br>
        You are now part of the <strong>EIDOS</strong> transmissions.
        From now on, you will receive new stories, articles and future signals.
      </p>

      <a class="btn" href="indexeng.html">
        ENTER THE BLOG
      </a>
    </div>
  </main>

  <footer class="footer">
    <p>
      © Felden Vareth ·
      <a href="../indexeng.html">eidoslibro.com</a> ·
      <a href="../termsandconditions.html">Privacy</a>
    </p>
  </footer>

  <script>
    const container = document.getElementById('particles');

    for(let i = 0; i < 28; i++){
      const p = document.createElement('div');

      p.className = 'particle';

      p.style.cssText = `
        left:${Math.random() * 100}%;
        bottom:${Math.random() * 20}%;
        --dur:${6 + Math.random() * 10}s;
        --delay:${Math.random() * 8}s;
        --drift:${(Math.random() - .5) * 60}px;
        --op:${.15 + Math.random() * .35};
      `;

      container.appendChild(p);
    }

    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');

    if(navToggle && navLinks){
      navToggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('active');

        navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        navToggle.textContent = isOpen ? '×' : '☰';
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
          navToggle.textContent = '☰';
        });
      });
    }
  </script>

</body>
</html>
