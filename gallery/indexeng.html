<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070710">
  <title>EIDOS · Gallery</title>
  <meta name="description" content="Visual gallery of the EIDOS universe.">
  <link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/gallery-enhanced.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__image ambient__image--a is-visible"></div>
    <div class="ambient__image ambient__image--b"></div>
    <div class="ambient__veil"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="../indexeng.html" aria-label="Return to the EIDOS homepage">EIDOS</a>
    <nav class="topbar__nav" aria-label="Gallery navigation">
      <span class="topbar__current">Gallery</span>
      <a href="screeneng.html">Screensaver</a>
      <button id="motion-toggle" class="icon-button" type="button" aria-pressed="false">Pause</button>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="gallery-title">
      <p class="eyebrow">Visual archive</p>
      <h1 id="gallery-title">The universe of <em>EIDOS</em></h1>
      <p class="hero__copy">Images from the EIDOS universe in a constantly evolving visual cycle.</p>
    </section>

    <section class="gallery-shell" aria-live="polite">
      <div id="gallery-status" class="gallery-status" hidden></div>
      <div id="eidos-grid" class="eidos-grid" hidden></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" hidden>
    <button id="lightbox-close" class="lightbox__close" type="button" aria-label="Close">×</button>
    <button id="lightbox-prev" class="lightbox__arrow lightbox__arrow--prev" type="button" aria-label="Previous image">‹</button>
    <figure class="lightbox__figure">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button id="lightbox-next" class="lightbox__arrow lightbox__arrow--next" type="button" aria-label="Next image">›</button>
  </div>

  <script src="js/image-source.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/gallery-enhanced.js"></script>
</body>
</html>
