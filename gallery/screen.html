<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>EIDOS · Salvapantallas</title>
  <meta name="description" content="Salvapantallas visual del universo de EIDOS.">
  <link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>
  <main id="screensaver" class="screensaver" aria-live="polite">
    <div class="screen-bg screen-bg--current"></div>
    <div class="screen-bg screen-bg--next"></div>
    <div class="screen-shade"></div>

    <div class="screen-stage">
      <img class="screen-image screen-image--current" alt="">
      <img class="screen-image screen-image--next" alt="">
    </div>

    <div id="screen-status" class="screen-status">Leyendo la carpeta de imágenes…</div>

    <header id="screen-controls" class="screen-controls">
      <a class="screen-brand" href="../index.html" aria-label="Volver a la página principal de EIDOS">EIDOS</a>
      <nav class="screen-nav" aria-label="Navegación del salvapantallas">
        <a href="index.html">Galería</a>
        <span class="screen-current">Salvapantallas</span>
        <button id="screen-pause" class="screen-button" type="button" aria-pressed="false">Pausar</button>
        <button id="screen-next" class="screen-button" type="button">Siguiente</button>
        <button id="screen-fullscreen" class="screen-button" type="button">Pantalla completa</button>
      </nav>
    </header>
  </main>

  <script src="js/image-source.js"></script>
  <script src="js/screen.js"></script>
</body>
</html>
