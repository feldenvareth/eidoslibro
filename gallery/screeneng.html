<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>EIDOS · Screensaver</title>
  <meta name="description" content="Visual screensaver from the EIDOS universe.">
  
  <!-- Social sharing / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EIDOS">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="EIDOS · Screensaver">
  <meta property="og:description" content="EIDOS universe screensaver with transitions, clock, date and countdown.">
  <meta property="og:url" content="https://www.eidoslibro.com/gallery/screeneng.html">
  <meta property="og:image" content="https://www.eidoslibro.com/gallery/images/galleryvisual.jpg">
  <meta property="og:image:secure_url" content="https://www.eidoslibro.com/gallery/images/galleryvisual.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="EIDOS · Galería visual">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EIDOS · Screensaver">
  <meta name="twitter:description" content="EIDOS universe screensaver with transitions, clock, date and countdown.">
  <meta name="twitter:image" content="https://www.eidoslibro.com/gallery/images/galleryvisual.jpg">
<link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/screen.css">

  <style>
    /* Selector de idioma: referencia visual del reproductor EIDOS, sin alterar el menú. */
    .screen-nav .lang-switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      padding: 0;
      line-height: 1;
    }
    .screen-nav .lang-switch img {
      display: block;
      width: 24px;
      height: 16px;
    }
    .screen-nav .lang-switch--text {
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>

</head>
<body>
  <main id="screensaver" class="screensaver" aria-live="polite">
    <div class="screen-bg screen-bg--current"></div>
    <div class="screen-bg screen-bg--next"></div>
    <div class="screen-shade"></div>

    <div class="screen-stage">
      <img class="screen-image screen-image--current" alt="">
      <img class="screen-image screen-image--next" alt="">
    </div>

    <div id="screen-status" class="screen-status">Loading image folder…</div>

    <section id="eidos-clock" class="eidos-clock" aria-label="EIDOS Clock">
      <div class="eidos-clock__frame">
        <div id="eidos-clock-time" class="eidos-clock__time" aria-live="off" aria-label="00:00"></div>
        <div id="eidos-clock-date" class="eidos-clock__date">01 · JAN · 2026</div>
        <div class="eidos-clock__signal" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </section>

    <header id="screen-controls" class="screen-controls">
      <a class="screen-brand" href="../indexeng.html" aria-label="Return to the EIDOS homepage">EIDOS</a>
      <nav class="screen-nav" aria-label="Screensaver navigation">
        <a href="indexeng.html">Gallery</a>
        <span class="screen-current">Screensaver</span>
        <button id="screen-pause" class="screen-button" type="button" aria-pressed="false">Pause</button>
        <button id="screen-next" class="screen-button" type="button">Next</button>
        <button id="screen-clock-settings" class="screen-button" type="button" aria-expanded="false">Clock</button>
        <button id="screen-fullscreen" class="screen-button" type="button">Fullscreen</button>
        <a href="screen.html" class="lang-switch" aria-label="Spanish version">
          <img src="../assets/images/flagspain.webp" alt="Spanish">
        </a>
      </nav>
    </header>

    <aside id="clock-panel" class="clock-panel" hidden>
      <div class="clock-panel__head">
        <span>EIDOS CLOCK</span>
        <button id="clock-panel-close" type="button" aria-label="Close settings">×</button>
      </div>

      <label class="clock-panel__master"><input id="clock-enabled" type="checkbox"> Enable display</label>

      <label class="clock-panel__select">
        <span>Mode</span>
        <select id="clock-mode">
          <option value="clock" selected>Clock</option>
          <option value="countdown">Countdown</option>
        </select>
      </label>

      <div id="clock-normal-options" class="clock-panel__group">
        <label><input id="clock-show-time" type="checkbox" checked> Show time</label>
        <label><input id="clock-show-date" type="checkbox" checked> Show date</label>
        <label><input id="clock-show-seconds" type="checkbox"> Show seconds</label>
        <label><input id="clock-24h" type="checkbox" checked> 24-hour format</label>
      </div>

      <div id="clock-countdown-options" class="clock-panel__group clock-countdown" hidden>
        <div class="clock-panel__time-setting">
          <span class="clock-panel__time-label">Time</span>

          <div class="clock-time-editor" role="group" aria-label="Countdown duration">
            <button id="clock-countdown-minus" class="clock-time-step" type="button" aria-label="Subtract from selected field">−</button>

            <div class="clock-time-values">
              <label class="clock-time-cell">
                <span class="clock-time-unit">HOURS</span>
                <input id="clock-countdown-hours" type="number" min="0" max="99" step="1" inputmode="numeric" value="0" aria-label="Hours">
              </label>

              <span class="clock-time-colon" aria-hidden="true">:</span>

              <label class="clock-time-cell">
                <span class="clock-time-unit">MIN</span>
                <input id="clock-countdown-minutes" type="number" min="0" max="59" step="1" inputmode="numeric" value="10" aria-label="Minutes">
              </label>

              <span class="clock-time-colon" aria-hidden="true">:</span>

              <label class="clock-time-cell">
                <span class="clock-time-unit">SEC</span>
                <input id="clock-countdown-seconds" type="number" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="Seconds">
              </label>
            </div>

            <button id="clock-countdown-plus" class="clock-time-step" type="button" aria-label="Add to selected field">+</button>
          </div>
        </div>

        <label class="clock-countdown__sound"><input id="clock-countdown-sound" type="checkbox" checked> Sound when finished</label>
        <div class="clock-countdown__actions">
          <button id="clock-countdown-start" type="button">Start</button>
          <button id="clock-countdown-pause" type="button">Pause</button>
          <button id="clock-countdown-reset" type="button">Reset</button>
        </div>
        <div class="clock-countdown__preset">
          <select id="clock-countdown-preset" class="sr-only" aria-label="Quick duration">
            <option value="300">5 minutes</option>
            <option value="600" selected>10 minutes</option>
            <option value="900">15 minutes</option>
            <option value="1800">30 minutes</option>
            <option value="2700">45 minutes</option>
            <option value="3600">1 hour</option>
            <option value="7200">2 hours</option>
            <option value="custom">Custom</option>
          </select>
          <button id="clock-preset-button" class="clock-preset-button" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="clock-preset-label">10 minutes</span><span class="clock-preset-chevron" aria-hidden="true">⌄</span>
          </button>
          <div id="clock-preset-menu" class="clock-preset-menu" role="listbox" aria-label="Quick duration">
            <button type="button" role="option" data-value="300">5 minutes</button>
            <button type="button" role="option" data-value="600" class="is-selected">10 minutes</button>
            <button type="button" role="option" data-value="900">15 minutes</button>
            <button type="button" role="option" data-value="1800">30 minutes</button>
            <button type="button" role="option" data-value="2700">45 minutes</button>
            <button type="button" role="option" data-value="3600">1 hour</button>
            <button type="button" role="option" data-value="7200">2 hours</button>
            <button type="button" role="option" data-value="custom">Custom</button>
          </div>
        </div>
        <div id="clock-countdown-status" class="clock-countdown__status sr-only" aria-live="polite">Ready · 10 min</div>
      </div>

      <div class="clock-panel__divider"></div>
      <label><input id="clock-motion" type="checkbox" checked> Smooth movement</label>
      <label class="clock-panel__select">
        <span>Style</span>
        <select id="clock-style">
          <option value="evolving" selected>Evolving</option>
          <option value="digital">Digital</option>
          <option value="fluid">Fluid</option>
        </select>
      </label>
    </aside>
  </main>

  <script src="js/image-manifest.js"></script>
  <script src="js/image-source.js"></script>
  <script src="js/screen.js"></script>
</body>
</html>
