<!-- ═══════════════════════════════════════════

     ═══════════════════════════════════════════ -->

<style>
  /* ─────────────────────────────────────────
     AISLAMIENTO BÁSICO DEL WIDGET
     ───────────────────────────────────────── */

  #eidos-launcher,
  #eidos-launcher *,
  #eidos-panel,
  #eidos-panel * {
    box-sizing: border-box;
  }


  /* ─────────────────────────────────────────
     CONTENEDOR DEL BOTÓN
     ───────────────────────────────────────── */

 #eidos-launcher {
  position: fixed;

  left: 18px;
  right: auto;
  bottom: 18px;

  z-index: 999999;

  display: flex;
  flex-direction: column;
  align-items: flex-start;

  gap: 7px;

  margin: 0;
  padding: 0;

  font-family: Georgia, serif;
}


  /* Fila de selección de minijuegos */
  .eidos-game-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
  }


  /* ─────────────────────────────────────────
     BURBUJA DE TEXTO
     ───────────────────────────────────────── */

  #eidos-bubble {
  display: block;

  margin: 0;
  padding: 6px 10px;

  background: rgba(30, 61, 47, 0.92);
  color: #f5ecd0;

  border: none;
  border-radius: 14px 14px 14px 4px;

  box-shadow:
    0 3px 10px rgba(0, 0, 0, 0.35);

  font-family: Georgia, serif;
  font-size: 11px;
  font-weight: normal;
  line-height: 1.2;

  white-space: nowrap;

  opacity: 0.88;

  animation:
    eidosPulse 2.5s infinite;
}

  @keyframes eidosPulse {
    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.7;
    }
  }


  /* ─────────────────────────────────────────
     BOTÓN CIRCULAR
     ───────────────────────────────────────── */

 .eidos-game-btn {
  width: 48px;
  height: 48px;

  margin: 0;
  padding: 0;

  background: rgba(30, 61, 47, 0.92);
  color: inherit;

  border: 1px solid #c8a84b;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.4);

  cursor: pointer;

  font-family: Georgia, serif;
  font-size: 20px;
  line-height: 1;

  appearance: none;
  -webkit-appearance: none;

  opacity: 0.88;

  transition:
    transform 0.2s ease,
    opacity 0.2s ease;
}

.eidos-game-btn:hover {
  transform: scale(1.06);
  opacity: 1;
}


/* Nave real del juego Péndulos: cápsula, estabilizadores, núcleo y halo */
.eidos-ship-icon {
  position: relative;
  display: block;
  width: 34px;
  height: 24px;
  pointer-events: none;
}

.eidos-ship-halo {
  position: absolute;
  left: 2px;
  top: 3px;
  width: 30px;
  height: 18px;
  border: 1px solid rgba(200, 168, 75, .7);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(200, 168, 75, .55);
  animation: eidosShipPulse 2.2s ease-in-out infinite;
}

.eidos-ship-body {
  position: absolute;
  left: 7px;
  top: 7px;
  width: 20px;
  height: 10px;
  border: 1px solid #c8a84b;
  border-radius: 7px;
  background: #183328;
  box-shadow: 0 0 5px rgba(200, 168, 75, .45);
}

.eidos-ship-arm {
  position: absolute;
  top: 11px;
  width: 5px;
  height: 1px;
  background: rgba(200, 168, 75, .85);
}

.eidos-ship-arm-left { left: 4px; }
.eidos-ship-arm-right { right: 4px; }

.eidos-ship-light {
  position: absolute;
  top: 9px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff7b5 0 20%, #c8a84b 45%, rgba(200,168,75,.15) 100%);
  box-shadow: 0 0 6px #c8a84b;
}

.eidos-ship-light-left { left: 0; }
.eidos-ship-light-right { right: 0; }

.eidos-ship-core {
  position: absolute;
  left: 14px;
  top: 9px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff 0 20%, #dffcf6 35%, #69b8aa 100%);
  box-shadow: 0 0 7px #8fd4c2;
}

@keyframes eidosShipPulse {
  0%, 100% { transform: scale(1); opacity: .55; }
  50% { transform: scale(1.08); opacity: .95; }
}




  /* ─────────────────────────────────────────
     PANEL DEL JUEGO
     Formato vertical adaptativo
     ───────────────────────────────────────── */

  #eidos-panel {
    display: none;

    position: fixed;

    right: 18px;
    bottom: 18px;

    z-index: 999998;

    /*
      El panel mantiene una proporción vertical.
      Altura máxima: 900 px.
      Anchura máxima: 620 px.
      También se reduce según el espacio disponible.
    */

    width: min(
      620px,
      calc(100vw - 36px),
      calc((100dvh - 36px) * 620 / 900)
    );

    height: min(
      900px,
      calc(100dvh - 36px),
      calc((100vw - 36px) * 900 / 620)
    );

    margin: 0;
    padding: 0;

    background: #111a14;

    border: 2px solid #4a7c6f;
    border-radius: 20px;

    box-shadow:
      0 8px 40px rgba(0, 0, 0, 0.7);

    overflow: hidden;
  }

  #eidos-panel.open {
    display: flex;
    flex-direction: column;
  }


  /* ─────────────────────────────────────────
     CABECERA DEL PANEL
     ───────────────────────────────────────── */

  #eidos-panel-header {
    flex: 0 0 58px;

    width: 100%;

    margin: 0;
    padding: 10px 18px;

    background: #111a14;
    color: #f5ecd0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border: none;

    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: normal;
    line-height: 1;
    letter-spacing: 5px;
  }

  #eidos-panel-header span {
    margin: 0;
    padding: 0;

    color: #f5ecd0;

    font-family: Georgia, serif;
    font-size: inherit;
    font-weight: normal;
    line-height: 1;
    letter-spacing: inherit;
  }


  /* ─────────────────────────────────────────
     BOTÓN DE CERRAR
     ───────────────────────────────────────── */

  #eidos-close {
    width: auto;
    height: auto;

    margin: 0;
    padding: 4px 6px;

    background: transparent;
    color: #888;

    border: none;
    border-radius: 0;

    cursor: pointer;

    font-family: Arial, sans-serif;
    font-size: 22px;
    font-weight: normal;
    line-height: 1;

    appearance: none;
    -webkit-appearance: none;

    transition:
      color 0.2s ease;
  }

  #eidos-close:hover {
    color: #fff;
  }


  /* ─────────────────────────────────────────
     IFRAME DEL JUEGO
     ───────────────────────────────────────── */

  #eidos-frame {
    display: block;

    flex: 1 1 auto;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    background: #111a14;

    border: none;

    overflow: hidden;
  }


  /* ─────────────────────────────────────────
     PANTALLAS ESTRECHAS
     ───────────────────────────────────────── */

  @media (max-width: 700px) {
  #eidos-launcher {
    left: 10px;
    right: auto;
    bottom: 10px;
  }

  .eidos-game-btn {
    width: 42px;
    height: 42px;

    font-size: 18px;
  }

  #eidos-bubble {
    max-width: calc(100vw - 20px);

    padding: 5px 8px;

    font-size: 10px;

    white-space: normal;
    text-align: center;
  }

  #eidos-panel {
    top: 8px;
    right: 8px;
    bottom: 8px;
    left: 8px;

    width: auto;
    height: auto;

    border-radius: 14px;
  }

  #eidos-panel-header {
    flex-basis: 48px;

    padding: 8px 12px;

    font-size: 17px;
    letter-spacing: 3px;
  }
}


  /* ─────────────────────────────────────────
     PANTALLAS BAJAS
     ───────────────────────────────────────── */

  @media (min-width: 701px) and (max-height: 760px) {
    #eidos-panel {
      top: 8px;
      bottom: 8px;

      width: min(
        500px,
        calc(100vw - 16px),
        calc((100dvh - 16px) * 500 / 720)
      );

      height: min(
        720px,
        calc(100dvh - 16px),
        calc((100vw - 16px) * 720 / 500)
      );
    }

    #eidos-panel-header {
      flex-basis: 46px;

      padding-top: 7px;
      padding-bottom: 7px;

      font-size: 16px;
    }
  }
</style>


<div id="eidos-launcher">

  <div id="eidos-bubble">
    Mientras escuchas · 🟡
  </div>

  <div class="eidos-game-buttons">

    <button
      class="eidos-game-btn"
      type="button"
      aria-label="Abrir Rompemuros"
      title="Rompemuros"
      onclick="openEidosGame('/hiddenegg/games/thewall/rompemuros.html')">
      🟡
    </button>

    <button
      class="eidos-game-btn"
      type="button"
      aria-label="Abrir juego de la nave"
      title="Juego de la nave"
      onclick="openEidosGame('/hiddenegg/games/pendulos/eidos_pendulos.html')">
      <span class="eidos-ship-icon" aria-hidden="true">
        <span class="eidos-ship-halo"></span>
        <span class="eidos-ship-body"></span>
        <span class="eidos-ship-arm eidos-ship-arm-left"></span>
        <span class="eidos-ship-arm eidos-ship-arm-right"></span>
        <span class="eidos-ship-light eidos-ship-light-left"></span>
        <span class="eidos-ship-light eidos-ship-light-right"></span>
        <span class="eidos-ship-core"></span>
      </span>
    </button>

  </div>

</div>


<div
  id="eidos-panel"
  aria-hidden="true">

  <div id="eidos-panel-header">

    <span>
      E I D O S
    </span>

    <button
      id="eidos-close"
      type="button"
      aria-label="Cerrar minijuego Eidos"
      onclick="toggleEidos()">
      ✕
    </button>

  </div>

  <iframe
    id="eidos-frame"
    src="/hiddenegg/games/thewall/rompemuros.html"
    title="Minijuego Eidos"
    scrolling="no">
  </iframe>

</div>


<script>
  function openEidosGame(gameUrl) {
    const panel =
      document.getElementById('eidos-panel');

    const bubble =
      document.getElementById('eidos-bubble');

    const frame =
      document.getElementById('eidos-frame');

    if (!panel || !bubble || !frame) {
      return;
    }

    frame.src = gameUrl;
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    bubble.style.display = 'none';
  }

  function toggleEidos() {
    const panel =
      document.getElementById('eidos-panel');

    const bubble =
      document.getElementById('eidos-bubble');

    if (!panel || !bubble) {
      return;
    }

    const isOpen =
      panel.classList.toggle('open');

    panel.setAttribute(
      'aria-hidden',
      isOpen ? 'false' : 'true'
    );

    bubble.style.display =
      isOpen ? 'none' : 'block';
  }


  window.addEventListener(
    'message',
    function(event) {
      if (event.data !== 'cerrar-eidos') {
        return;
      }

      const panel =
        document.getElementById('eidos-panel');

      const bubble =
        document.getElementById('eidos-bubble');

      panel.classList.remove('open');

      panel.setAttribute(
        'aria-hidden',
        'true'
      );

      bubble.style.display = 'block';
    }
  );
</script>

    scrolling="no">
  </iframe>

</div>


<script>
  /* ─────────────────────────────────────────
     REFERENCIAS DEL WIDGET
     ───────────────────────────────────────── */

  const eidosLauncher =
    document.getElementById('eidos-launcher');

  const eidosPanel =
    document.getElementById('eidos-panel');

  const eidosBubble =
    document.getElementById('eidos-bubble');

  const eidosFrame =
    document.getElementById('eidos-frame');


  /* ─────────────────────────────────────────
     ABRIR EL JUEGO ELEGIDO
     ───────────────────────────────────────── */

  function openEidosGame(gameUrl) {
    if (!eidosPanel || !eidosBubble || !eidosFrame) {
      return;
    }

    eidosFrame.src = gameUrl;
    eidosPanel.classList.add('open');
    eidosPanel.setAttribute('aria-hidden', 'false');
    eidosBubble.style.display = 'none';
  }


  /* ─────────────────────────────────────────
     ABRIR O CERRAR EL JUEGO
     ───────────────────────────────────────── */

  function toggleEidos() {
    if (!eidosPanel || !eidosBubble) {
      return;
    }

    const isOpen =
      eidosPanel.classList.toggle('open');

    eidosPanel.setAttribute(
      'aria-hidden',
      isOpen ? 'false' : 'true'
    );

    eidosBubble.style.display =
      isOpen ? 'none' : 'block';
  }


  /* ─────────────────────────────────────────
     CERRAR EL JUEGO
     Nunca lo abre por accidente
     ───────────────────────────────────────── */

  function closeEidos() {
    if (!eidosPanel || !eidosBubble) {
      return;
    }

    eidosPanel.classList.remove('open');

    eidosPanel.setAttribute(
      'aria-hidden',
      'true'
    );

    eidosBubble.style.display = 'block';
  }


  /* ─────────────────────────────────────────
     EL LECTOR EMPIEZA
     Mostrar el icono del minijuego
     ───────────────────────────────────────── */

  document.addEventListener(
    'eidos-reader-start',
    function() {
      if (!eidosLauncher) {
        return;
      }

      eidosLauncher.style.display = 'flex';
    }
  );


  /* ─────────────────────────────────────────
     EL LECTOR SE DETIENE
     Ocultar el icono y cerrar el juego
     ───────────────────────────────────────── */

  document.addEventListener(
    'eidos-reader-stop',
    function() {
      if (eidosLauncher) {
        eidosLauncher.style.display = 'none';
      }

      closeEidos();
    }
  );


  /* ─────────────────────────────────────────
     MENSAJE ENVIADO DESDE EL IFRAME
     ───────────────────────────────────────── */

  window.addEventListener(
    'message',
    function(event) {
      if (event.data !== 'cerrar-eidos') {
        return;
      }

      closeEidos();
    }
  );
</script>
