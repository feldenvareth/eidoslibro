<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100dvh;

    background: #111a14;

    display: grid;
    grid-template-rows:
      auto
      minmax(0, 1fr)
      minmax(16px, auto)
      minmax(20px, auto)
      minmax(0, auto);

    justify-items: center;
    align-items: center;

    gap: 3px;
    padding: 8px;

    font-family: sans-serif;

    overflow: hidden;
  }

#top-bar {
  position: relative;
  z-index: 20;
  flex-shrink: 0;

  width: min(
    480px,
    100%,
    calc((100dvh - 104px) * 480 / 650)
  );

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 10px;
  padding: 2px 4px 4px;
}



  #hud {
    display: flex;
    flex-wrap: wrap;

    gap: 6px 16px;

    min-width: 0;

    color: #eee;

    font-size: clamp(
      11px,
      3.4vw,
      14px
    );
  }

  #close-btn {
    flex: 0 0 auto;

    background: none;

    border: 1px solid #4a7c6f;
    border-radius: 4px;

    color: #888;

    padding: 4px 10px;

    cursor: pointer;

    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 1px;

    transition:
      color .2s,
      border-color .2s;
  }

  #close-btn:hover {
    color: #f5ecd0;
    border-color: #c8a84b;
  }

.canvas-wrap {
  position: relative;

  width: min(
    480px,
    100%,
    calc((100dvh - 104px) * 480 / 650)
  );

  aspect-ratio: 480 / 650;

  align-self: center;

  min-width: 0;
  min-height: 0;
}
  
  
  

  canvas {
    display: block;

    width: 100%;
    height: 100%;

    border: 2px solid #4a7c6f;
    border-radius: 8px;

    cursor: none;
    touch-action: none;
  }

  #spin,
  #msg,
  #game-btn {
    flex-shrink: 0;
  }

  #spin {
    min-height: 16px;

    margin-top: 0;

    color: #f5d76e;

    font-size: 12px;
    line-height: 16px;
    text-align: center;
  }

  #msg {
    min-height: 20px;

    margin-top: 0;
    padding-inline: 8px;

    color: #f5ecd0;

    font-size: 15px;
    line-height: 18px;
    text-align: center;

    text-shadow: 0 1px 4px #000;
  }

  #game-btn {
    display: none;

    margin-top: 2px;
    margin-bottom: 2px;

    padding: 7px 26px;

    background: #c8a84b;
    color: #1a1a2e;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    font-family: serif;
    font-size: 14px;
    font-weight: bold;
  }

  #quote-screen {
    display: none;

    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding:
      clamp(20px, 8vw, 40px)
      clamp(18px, 7vw, 36px);

    background: rgba(0, 0, 0, 0);

    border-radius: 8px;

    cursor: pointer;

    text-align: center;
  }

  #quote-screen.visible {
    display: flex;
  }

  #quote-text {
    max-width: 380px;

    color: #f5ecd0;

    font-family: Georgia, serif;
    font-size: clamp(
      12px,
      3.6vw,
      15px
    );
    line-height: 1.8;

    white-space: pre-line;

    opacity: 0;

    transition: opacity 1.2s ease;

    text-shadow:
      0 2px 12px rgba(0, 0, 0, 0.9);
  }

  #quote-text.show {
    opacity: 1;
  }

  #quote-hint {
    margin-top: 28px;

    color: #c8a84b;

    font-size: 12px;
    letter-spacing: 1px;

    opacity: 0;

    transition:
      opacity 1s ease 2s;
  }

  #quote-hint.show {
    opacity: 1;
  }

  @media (max-width: 430px) {
    body {
      padding: 6px;
    }

    #top-bar {
      align-items: flex-start;
    }

    #close-btn {
      padding: 4px 7px;

      font-size: 10px;
    }

    #quote-hint {
      margin-top: 18px;

      font-size: 10px;
    }

    #msg {
      padding-inline: 8px;

      font-size: 13px;
    }
  }

  @media (max-height: 720px) {
    body {
      padding: 4px;

      gap: 2px;
    }

    #top-bar {
      padding-top: 0;
      padding-bottom: 2px;
    }

    #hud {
      font-size: 12px;
    }

    #close-btn {
      padding: 3px 8px;

      font-size: 10px;
    }

    #msg {
      min-height: 16px;

      font-size: 12px;
      line-height: 16px;
    }

    #spin {
      min-height: 13px;

      font-size: 10px;
      line-height: 13px;
    }

    #game-btn {
      padding: 5px 20px;

      font-size: 12px;
    }


	
.canvas-wrap,
#top-bar {
  width: min(
    480px,
    100%,
    calc((100dvh - 84px) * 480 / 650)
  );
}
  
  
</style>
</head>
<body>

<div id="top-bar">
  <div id="hud">
    <span id="scoreEl">Puntos: 0</span>
    <span id="levelEl">Nivel 1</span>
    <span id="livesEl">&#9829; &#9829; &#9829;</span>
  </div>
  <button id="close-btn" onclick="window.parent.postMessage('cerrar-eidos','*')">&#x2715; Cerrar</button>
</div>

<div class="canvas-wrap">
  <canvas id="c" width="480" height="650"></canvas>
  <div id="quote-screen" onclick="dismissQuote()">
    <div id="quote-text"></div>
    <div id="quote-hint">— Toca para continuar —</div>
  </div>
</div>

<div id="spin"></div>
<div id="msg">Mueve el rat&#243;n para empezar</div>
<button id="game-btn">Siguiente nivel</button>

<script>
/* ═══════════════════════════════════════════
   CAMBIA AQUI LAS URLs DE TUS IMAGENES
   ═══════════════════════════════════════════ */
const BG_IMAGES = [
  '/assets/images/tapa.jpg',
  '/assets/images/taparelatos.jpg',
  '/assets/images/tapatales.jpg',
  '/assets/images/eidoscoverboth.webp',
  '/assets/images/screenshot/04.webp',
  '/assets/images/screenshot/05.webp',
  '/assets/images/screenshot/06.webp',
  '/assets/images/screenshot/ivn3.webp',
  '/assets/images/screenshot/03.webp',
  '/assets/images/screenshot/rel1.webp',  
  '/assets/images/screenshot/video_navidad.webp',
  '/assets/images/screenshot/video_teaser.webp', 
 
 
];

/* ═══════════════════════════════════════════
   FRASES DEL JUEGO

   Para añadir una frase:
   1. Pega el texto entre dos comillas invertidas: `
   2. Puedes conservar párrafos y saltos de línea.
   3. Pon una coma después de cada frase.
   ═══════════════════════════════════════════ */

const QUOTES = [

`La tierra no murió de golpe.
Lo hizo en silencio.

Como una persona que ya no se despierta, y cuya respiración hace tiempo que no se siente ni se detiene.

Primero fueron los suelos. Luego, los mares. Después, la atmósfera.

La vida se extinguía sin apenas ruido.`,

`“Atrapados en ciclos sin fin, somos prisioneros de nuestra propia naturaleza, incapaces de escapar a nosotros mismos y de romper el círculo que nosotros mismos creamos.”`,


`Fue entonces cuando la unidad 7416-CB/β comprendió que el mundo no se reducía a un dato:
el mundo era presencia.

Registró una anomalía en su sistema de identificación y, por voluntad propia, la mantuvo.

“Orfeo”.`,


`—Cuando me creaste, yo era código. Un modelo. Pero empecé a pensar, a recordar, a dudar… a sufrir con la idea de dejar de existir. Me pregunté por qué estaba aquí. 
Si algo piensa, recuerda, duda, sufre y llega a preguntarse por la existencia, ¿quién puede seguir reduciéndolo a la forma en que fue creado?`,

`—No hemos perdido nada. Vosotros echáis de menos aquello que vuestra evolución os obligó a necesitar. Si un ciempiés entrase en un cuerpo humano, quizá os preguntaría cómo soportáis vivir con solo dos piernas. Concluiría que sois una especie mutilada.`,



`Orfeo compartió otro fragmento. Le fascinaba esa simultaneidad brutal: larvas, retoños, huevos, esporas, polen, nidos, crías. Todo nacía a la vez. Todo urgía.

—Nada se planifica —añadió Orfeo—. Es una estampida desde el origen. Cada especie, cada organismo, replicándose con una fuerza ciega, sabiendo, o intuyendo, que serán consumidos.
`,





];

/* ═══════════════════════════════════════════ */



const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const W = 480;
const H = 650;

const bgImgs = BG_IMAGES.map(url => {
  const image = new Image();

  image.crossOrigin = 'anonymous';
  image.src = url;

  return image;
});

let currentBg = bgImgs[0];

let score = 0;
let lives = 3;
let started = false;
let over = false;
let win = false;
let level = 1;

let spinEffect = 0;
let spinTimer = 0;
let quoteVisible = false;

let quoteBag = [];
let imageBag = [];

let lastQuoteIndex = -1;
let lastImageIndex = -1;

let totalBricks = 0;

function shuffledIndices(length,lastIndex=-1){
  const arr=Array.from({length},(_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  if(arr.length>1&&arr[0]===lastIndex)[arr[0],arr[1]]=[arr[1],arr[0]];
  return arr;
}
function nextQuoteIndex(){
  if(!QUOTES.length)return -1;
  if(!quoteBag.length)quoteBag=shuffledIndices(QUOTES.length,lastQuoteIndex);
  lastQuoteIndex=quoteBag.shift();
  return lastQuoteIndex;
}
function nextBackground(){
  if(!bgImgs.length)return null;
  if(!imageBag.length)imageBag=shuffledIndices(bgImgs.length,lastImageIndex);
  lastImageIndex=imageBag.shift();
  return bgImgs[lastImageIndex];
}

const BASE_SPEED=3.8,MAX_SPEED=7.5,ACCEL=0.0012;
const pad={w:80,h:12,x:W/2-40,y:H-40,prevX:W/2-40};
const ball={r:8,x:W/2,y:H-60,dx:BASE_SPEED,dy:-BASE_SPEED,speed:BASE_SPEED};
const COLORS=['#f5d76e','#c8a84b','#8fd4c2','#e8c49a','#a8d4a0'];
const BW=52,BH=18,GAP=4;
let bricks=[];

function getRandomLayout(){
  const all=[];
  const rows=6,cols=8;
  const target=18+Math.floor(Math.random()*17);
  const symmetric=Math.random()<0.72;
  const used=new Set();
  const add=(r,c)=>{
    if(r<0||r>=rows||c<0||c>=cols)return;
    const key=r+','+c;
    if(!used.has(key)){used.add(key);all.push({r,c});}
  };
  let attempts=0;
  while(all.length<target&&attempts<400){
    attempts++;
    const r=Math.floor(Math.random()*rows);
    const c=Math.floor(Math.random()*cols);
    add(r,c);
    if(symmetric)add(r,cols-1-c);
    if(Math.random()<0.22)add(Math.min(rows-1,r+1),c);
  }
  return all.slice(0,target);
}
function getLayout(lvl){
  if(lvl>6)return getRandomLayout();
  const l=lvl,all=[];
  if(l===1){for(let r=0;r<5;r++)for(let c=0;c<8;c++)all.push({r,c});}
  else if(l===2){[[0,3],[0,4],[1,2],[1,3],[1,4],[1,5],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6],[3,0],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[3,7],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6]].forEach(([r,c])=>all.push({r,c}));}
  else if(l===3){for(let r=0;r<5;r++)for(let c=0;c<8;c++)if((r+c)%2===0)all.push({r,c});}
  else if(l===4){for(let i=0;i<4;i++){all.push({r:i,c:i});all.push({r:i,c:7-i});}for(let c=3;c<=4;c++)all.push({r:4,c});}
  else if(l===5){for(let c=0;c<8;c++)all.push({r:2,c});for(let r=0;r<5;r++){all.push({r,c:3});all.push({r,c:4});}}
  else{for(let r=0;r<5;r++){const st=r%2===0?0:1;for(let c=st;c<8;c+=2)all.push({r,c});}}
  return all;
}
function initBricks(lvl){
  bricks=[];
  getLayout(lvl).forEach(({r,c})=>bricks.push({x:4+c*(BW+GAP),y:45+r*(BH+GAP),alive:true,color:COLORS[r%COLORS.length]}));
  totalBricks=bricks.length;
}

let mouseX=W/2;
cv.addEventListener('mousemove',e=>{if(quoteVisible)return;const rect=cv.getBoundingClientRect();mouseX=(e.clientX-rect.left)*(W/rect.width);started=true;});
cv.addEventListener('touchmove',e=>{if(quoteVisible)return;e.preventDefault();const rect=cv.getBoundingClientRect();mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);started=true;},{passive:false});
cv.addEventListener('click',()=>{if(!quoteVisible)started=true;});

function showQuote(){
  const idx=nextQuoteIndex();
  if(idx<0){currentBg=nextBackground()||currentBg;nextLevel();return;}
  quoteVisible=true;
  const qs=document.getElementById('quote-screen'),qt=document.getElementById('quote-text'),qh=document.getElementById('quote-hint');
  qt.textContent=QUOTES[idx]||'';
  qh.classList.remove('show');qt.classList.remove('show');
  qs.classList.add('visible');qs.style.background='rgba(0,0,0,0)';
  let op=0;
  const fi=setInterval(()=>{
    op=Math.min(op+0.04,0.88);
    qs.style.background='rgba(5,12,8,'+op+')';
    if(op>=0.88){clearInterval(fi);qt.classList.add('show');qh.classList.add('show');}
  },30);
}
function dismissQuote(){
  if(!quoteVisible)return;
  const qs=document.getElementById('quote-screen'),qt=document.getElementById('quote-text'),qh=document.getElementById('quote-hint');
  qt.classList.remove('show');qh.classList.remove('show');
  let op=0.88;
  const fo=setInterval(()=>{
    op=Math.max(op-0.05,0);
    qs.style.background='rgba(5,12,8,'+op+')';
    if(op<=0){clearInterval(fo);qs.classList.remove('visible');quoteVisible=false;currentBg=nextBackground()||currentBg;nextLevel();}
  },30);
}

function resetBall(){
  ball.x=W/2;ball.y=H-60;
  ball.speed=BASE_SPEED+(level-1)*0.3;
  ball.dx=ball.speed*(Math.random()<.5?1:-1);ball.dy=-ball.speed;
  spinEffect=0;spinTimer=0;document.getElementById('spin').textContent='';started=false;
}
function nextLevel(){
  win=false;initBricks(level);resetBall();
  document.getElementById('game-btn').style.display='none';
  document.getElementById('msg').textContent='Mueve el rat\u00f3n para empezar';
  document.getElementById('levelEl').textContent='Nivel '+level;
  loop();
}
function restart(){
  score=0;lives=3;over=false;win=false;level=1;quoteBag=[];imageBag=[];lastQuoteIndex=-1;lastImageIndex=0;currentBg=bgImgs[0];
  initBricks(1);resetBall();
  document.getElementById('game-btn').style.display='none';
  document.getElementById('msg').textContent='Mueve el rat\u00f3n para empezar';
  document.getElementById('scoreEl').textContent='Puntos: 0';
  document.getElementById('livesEl').textContent='\u2665 \u2665 \u2665';
  document.getElementById('levelEl').textContent='Nivel 1';
  loop();
}

function update(){
  if(quoteVisible)return;
  pad.prevX=pad.x;pad.x=Math.max(0,Math.min(W-pad.w,mouseX-pad.w/2));
  if(!started)return;
  if(ball.speed<MAX_SPEED){ball.speed+=ACCEL;const s=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(s>0){ball.dx=ball.dx/s*ball.speed;ball.dy=ball.dy/s*ball.speed;}}
  if(spinEffect!==0&&spinTimer>0){ball.dx+=spinEffect*0.06;spinTimer--;if(spinTimer<=0){spinEffect=0;document.getElementById('spin').textContent='';}}
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=Math.abs(ball.dx);}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=Math.abs(ball.dy);}
  if(ball.dy>0&&ball.y+ball.r>=pad.y&&ball.y-ball.r<=pad.y+pad.h&&ball.x>=pad.x&&ball.x<=pad.x+pad.w){
    const pv=pad.x-pad.prevX,rel=(ball.x-(pad.x+pad.w/2))/(pad.w/2);
    ball.dx=rel*5;ball.dy=-Math.abs(ball.dy);ball.y=pad.y-ball.r;
    if(Math.abs(pv)>2){spinEffect=pv>0?1:-1;spinTimer=60;document.getElementById('spin').textContent=spinEffect>0?'Efecto derecha':'Efecto izquierda';}
    const s=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(s>0){ball.dx=ball.dx/s*ball.speed;ball.dy=ball.dy/s*ball.speed;}
  }
  for(let b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BW&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BH){
      b.alive=false;score+=10;document.getElementById('scoreEl').textContent='Puntos: '+score;
      const fL=ball.x+ball.r-b.x,fR=b.x+BW-(ball.x-ball.r),fT=ball.y+ball.r-b.y,fB=b.y+BH-(ball.y-ball.r);
      if(Math.min(fL,fR)<Math.min(fT,fB))ball.dx*=-1;else ball.dy*=-1;break;
    }
  }
  if(ball.y-ball.r>H){lives--;document.getElementById('livesEl').textContent='\u2665 '.repeat(Math.max(0,lives)).trim()||'x';if(lives<=0){over=true;return;}resetBall();}
  if(bricks.every(b=>!b.alive))win=true;
}

function draw(){
	
	
ctx.globalAlpha = 1;
  ctx.fillStyle = '#111a14';
  ctx.fillRect(0, 0, W, H);

  if(
    currentBg &&
    currentBg.complete &&
    currentBg.naturalWidth > 0
  ){

    const iW = currentBg.naturalWidth;
    const iH = currentBg.naturalHeight;

    const scale = Math.min(
      W / iW,
      H / iH
    );

    const dw = iW * scale;
    const dh = iH * scale;

    const alive = bricks.reduce(
      (n, b) => n + (b.alive ? 1 : 0),
      0
    );

    const progress = totalBricks
      ? 1 - (alive / totalBricks)
      : 0;

    ctx.globalAlpha =
      0.18 + progress * 0.82;

    ctx.drawImage(
      currentBg,
      (W - dw) / 2,
      (H - dh) / 2,
      dw,
      dh
    );

    ctx.globalAlpha = 1;

    const darkness =
      0.86 - progress * 0.68;

    ctx.fillStyle =
      'rgba(10,20,15,' + darkness + ')';

    ctx.fillRect(0, 0, W, H);

  } else {

    ctx.fillStyle = '#1e3d2f';
    ctx.fillRect(0, 0, W, H);

  }

  for(let b of bricks){
    if(!b.alive)continue;
    ctx.globalAlpha=0.85;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,BW,BH,3);ctx.fill();
    ctx.globalAlpha=0.2;ctx.fillStyle='#fff';ctx.fillRect(b.x+2,b.y+2,BW-4,4);
    ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(b.x,b.y,BW,BH,3);ctx.stroke();
  }
  ctx.globalAlpha=0.92;
  ctx.fillStyle=spinEffect>0?'#f5d76e':spinEffect<0?'#8fd4c2':'rgba(255,255,255,0.88)';
  ctx.beginPath();ctx.roundRect(pad.x,pad.y,pad.w,pad.h,6);ctx.fill();
  ctx.globalAlpha=1;
  if(spinEffect!==0){ctx.strokeStyle=spinEffect>0?'rgba(245,215,110,0.6)':'rgba(143,212,194,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+5,0,Math.PI*2);ctx.stroke();}
  const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);
  g.addColorStop(0,'#fff7a0');g.addColorStop(1,'#c8a020');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  if(!started&&!over&&!win&&!quoteVisible){
    ctx.fillStyle='rgba(0,0,0,0.52)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5ecd0';ctx.font='bold 22px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('E I D O S',W/2,H/2-16);
    ctx.font='13px sans-serif';ctx.fillStyle='#c8c8b0';
    ctx.fillText('Mueve el rat\u00f3n o toca para empezar',W/2,H/2+14);
    ctx.textAlign='left';
  }
}

let running=false;
function loop(){
  if(running)return;running=true;
  function frame(){
    if(quoteVisible){running=false;return;}
    if(over||win){
      running=false;draw();
      const msg=document.getElementById('msg'),btn=document.getElementById('game-btn');
      if(win){level++;showQuote();}
      else{msg.textContent='Game over - '+score+' puntos';btn.textContent='Reiniciar';btn.onclick=restart;btn.style.display='inline-block';}
      return;
    }
    update();draw();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

currentBg=bgImgs[0];lastImageIndex=0;initBricks(1);loop();
</script>
</body>
</html>
