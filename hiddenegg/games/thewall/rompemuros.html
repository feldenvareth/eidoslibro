<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111a14; display: flex; flex-direction: column; align-items: center; padding: 10px; font-family: sans-serif; }

  #top-bar {
    width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 6px;
  }
  #hud { display: flex; gap: 20px; font-size: 14px; color: #eee; }
  #close-btn {
    background: none; border: 1px solid #4a7c6f; color: #888; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
    letter-spacing: 1px; transition: color .2s, border-color .2s;
  }
  #close-btn:hover { color: #f5ecd0; border-color: #c8a84b; }

  canvas { display: block; border: 2px solid #4a7c6f; border-radius: 8px; cursor: none; }
  #spin { color: #f5d76e; font-size: 12px; min-height: 16px; text-align: center; margin-top: 4px; }
  #msg  { color: #f5ecd0; font-size: 15px; min-height: 20px; text-align: center; margin-top: 2px; text-shadow: 0 1px 4px #000; }
  #game-btn {
    margin-top: 8px; padding: 7px 26px; background: #c8a84b; color: #1a1a2e;
    border: none; border-radius: 6px; font-size: 14px;
    cursor: pointer; font-weight: bold; font-family: serif; display: none;
  }

  #quote-screen {
    display: none; position: absolute; top: 0; left: 0; width: 480px; height: 500px;
    background: rgba(0,0,0,0); z-index: 10;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 36px; text-align: center; border-radius: 8px; cursor: pointer;
  }
  #quote-screen.visible { display: flex; }
  #quote-text {
    color: #f5ecd0; font-family: Georgia, serif; font-size: 15px;
    line-height: 1.8; opacity: 0; transition: opacity 1.2s ease;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9); max-width: 380px;
  }
  #quote-text.show { opacity: 1; }
  #quote-hint {
    margin-top: 28px; color: #c8a84b; font-size: 12px;
    letter-spacing: 1px; opacity: 0; transition: opacity 1s ease 2s;
  }
  #quote-hint.show { opacity: 1; }
  .canvas-wrap { position: relative; }
</style>
</head>
<body>

<div id="top-bar">
  <div id="hud">
    <span id="scoreEl">Puntos: 0</span>
    <span id="levelEl">Nivel 1</span>
    <span id="livesEl">&#9829; &#9829; &#9829;</span>
  </div>
  <button id="close-btn" onclick="window.parent.postMessage('cerrar-eidos','*')">&#x2715; Cerrar</button>
</div>

<div class="canvas-wrap">
  <canvas id="c" width="480" height="500"></canvas>
  <div id="quote-screen" onclick="dismissQuote()">
    <div id="quote-text"></div>
    <div id="quote-hint">— Toca para continuar —</div>
  </div>
</div>

<div id="spin"></div>
<div id="msg">Mueve el rat&#243;n para empezar</div>
<button id="game-btn">Siguiente nivel</button>

<script>
/* ═══════════════════════════════════════════
   CAMBIA AQUI LAS URLs DE TUS IMAGENES
   ═══════════════════════════════════════════ */
const BG_IMAGES = [
  '/assets/images/tapa.jpg',        // Nivel 1
  '/assets/images/taparelatos.jpg', // Nivel 2
  '/assets/images/tapa.jpg',        // Nivel 3
];

/* ═══════════════════════════════════════════
   FRASES POR NIVEL
   ═══════════════════════════════════════════ */
const QUOTES = [
  'La tierra no muri\u00f3 de golpe.\nLo hizo en silencio.\n\nComo una persona que ya no se despierta, y cuya respiraci\u00f3n hace tiempo que no se siente ni se detiene.\n\nPrimero fueron los suelos. Luego, los mares. Despu\u00e9s, la atm\u00f3sfera.\n\nLa vida se extingu\u00eda sin apenas ruido.',
  '"Atrapados en ciclos sin fin, somos prisioneros de nuestra propia naturaleza, incapaces de escapar a nosotros mismos y de romper el c\u00edrculo que nosotros mismos creamos."',
  'Fue entonces cuando la unidad 7416-CB/\u03b2 comprendi\u00f3 que el mundo no se reduc\u00eda a un dato:\nel mundo era presencia.\n\nRegist\u00f3 una anomal\u00eda en su sistema de identificaci\u00f3n y, por voluntad propia, la mantuvo.\n\n"Orfeo".',
];
/* ═══════════════════════════════════════════ */

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=480, H=500;
const bgImgs=BG_IMAGES.map(url=>{ const i=new Image(); i.crossOrigin='anonymous'; i.src=url; return i; });
let currentBg=bgImgs[0];
let score=0,lives=3,started=false,over=false,win=false,level=1;
let spinEffect=0,spinTimer=0,quoteVisible=false;
const BASE_SPEED=3.8,MAX_SPEED=7.5,ACCEL=0.0012;
const pad={w:80,h:12,x:W/2-40,y:H-40,prevX:W/2-40};
const ball={r:8,x:W/2,y:H-60,dx:BASE_SPEED,dy:-BASE_SPEED,speed:BASE_SPEED};
const COLORS=['#f5d76e','#c8a84b','#8fd4c2','#e8c49a','#a8d4a0'];
const BW=52,BH=18,GAP=4;
let bricks=[];

function getLayout(lvl){
  const l=((lvl-1)%6)+1,all=[];
  if(l===1){for(let r=0;r<5;r++)for(let c=0;c<8;c++)all.push({r,c});}
  else if(l===2){[[0,3],[0,4],[1,2],[1,3],[1,4],[1,5],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6],[3,0],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[3,7],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6]].forEach(([r,c])=>all.push({r,c}));}
  else if(l===3){for(let r=0;r<5;r++)for(let c=0;c<8;c++)if((r+c)%2===0)all.push({r,c});}
  else if(l===4){for(let i=0;i<4;i++){all.push({r:i,c:i});all.push({r:i,c:7-i});}for(let c=3;c<=4;c++)all.push({r:4,c});}
  else if(l===5){for(let c=0;c<8;c++)all.push({r:2,c});for(let r=0;r<5;r++){all.push({r,c:3});all.push({r,c:4});}}
  else{for(let r=0;r<5;r++){const s=r%2===0?0:1;for(let c=s;c<8;c+=2)all.push({r,c});}}
  return all;
}
function initBricks(lvl){
  bricks=[];
  getLayout(lvl).forEach(({r,c})=>bricks.push({x:4+c*(BW+GAP),y:45+r*(BH+GAP),alive:true,color:COLORS[r%COLORS.length]}));
}

let mouseX=W/2;
cv.addEventListener('mousemove',e=>{if(quoteVisible)return;const rect=cv.getBoundingClientRect();mouseX=(e.clientX-rect.left)*(W/rect.width);started=true;});
cv.addEventListener('touchmove',e=>{if(quoteVisible)return;e.preventDefault();const rect=cv.getBoundingClientRect();mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);started=true;},{passive:false});
cv.addEventListener('click',()=>{if(!quoteVisible)started=true;});

function showQuote(idx){
  quoteVisible=true;
  const qs=document.getElementById('quote-screen'),qt=document.getElementById('quote-text'),qh=document.getElementById('quote-hint');
  qt.textContent=QUOTES[idx]||'';
  qh.classList.remove('show');qt.classList.remove('show');
  qs.classList.add('visible');qs.style.background='rgba(0,0,0,0)';
  let op=0;
  const fi=setInterval(()=>{
    op=Math.min(op+0.04,0.88);
    qs.style.background='rgba(5,12,8,'+op+')';
    if(op>=0.88){clearInterval(fi);qt.classList.add('show');qh.classList.add('show');}
  },30);
}
function dismissQuote(){
  if(!quoteVisible)return;
  const qs=document.getElementById('quote-screen'),qt=document.getElementById('quote-text'),qh=document.getElementById('quote-hint');
  qt.classList.remove('show');qh.classList.remove('show');
  let op=0.88;
  const fo=setInterval(()=>{
    op=Math.max(op-0.05,0);
    qs.style.background='rgba(5,12,8,'+op+')';
    if(op<=0){clearInterval(fo);qs.classList.remove('visible');quoteVisible=false;currentBg=bgImgs[Math.min(level,bgImgs.length-1)];nextLevel();}
  },30);
}

function resetBall(){
  ball.x=W/2;ball.y=H-60;
  ball.speed=BASE_SPEED+(level-1)*0.3;
  ball.dx=ball.speed*(Math.random()<.5?1:-1);ball.dy=-ball.speed;
  spinEffect=0;spinTimer=0;document.getElementById('spin').textContent='';started=false;
}
function nextLevel(){
  win=false;initBricks(level);resetBall();
  document.getElementById('game-btn').style.display='none';
  document.getElementById('msg').textContent='Mueve el rat\u00f3n para empezar';
  document.getElementById('levelEl').textContent='Nivel '+level;
  loop();
}
function restart(){
  score=0;lives=3;over=false;win=false;level=1;currentBg=bgImgs[0];
  initBricks(1);resetBall();
  document.getElementById('game-btn').style.display='none';
  document.getElementById('msg').textContent='Mueve el rat\u00f3n para empezar';
  document.getElementById('scoreEl').textContent='Puntos: 0';
  document.getElementById('livesEl').textContent='\u2665 \u2665 \u2665';
  document.getElementById('levelEl').textContent='Nivel 1';
  loop();
}

function update(){
  if(quoteVisible)return;
  pad.prevX=pad.x;pad.x=Math.max(0,Math.min(W-pad.w,mouseX-pad.w/2));
  if(!started)return;
  if(ball.speed<MAX_SPEED){ball.speed+=ACCEL;const s=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(s>0){ball.dx=ball.dx/s*ball.speed;ball.dy=ball.dy/s*ball.speed;}}
  if(spinEffect!==0&&spinTimer>0){ball.dx+=spinEffect*0.06;spinTimer--;if(spinTimer<=0){spinEffect=0;document.getElementById('spin').textContent='';}}
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=Math.abs(ball.dx);}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=Math.abs(ball.dy);}
  if(ball.dy>0&&ball.y+ball.r>=pad.y&&ball.y-ball.r<=pad.y+pad.h&&ball.x>=pad.x&&ball.x<=pad.x+pad.w){
    const pv=pad.x-pad.prevX,rel=(ball.x-(pad.x+pad.w/2))/(pad.w/2);
    ball.dx=rel*5;ball.dy=-Math.abs(ball.dy);ball.y=pad.y-ball.r;
    if(Math.abs(pv)>2){spinEffect=pv>0?1:-1;spinTimer=60;document.getElementById('spin').textContent=spinEffect>0?'Efecto derecha':'Efecto izquierda';}
    const s=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(s>0){ball.dx=ball.dx/s*ball.speed;ball.dy=ball.dy/s*ball.speed;}
  }
  for(let b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BW&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BH){
      b.alive=false;score+=10;document.getElementById('scoreEl').textContent='Puntos: '+score;
      const fL=ball.x+ball.r-b.x,fR=b.x+BW-(ball.x-ball.r),fT=ball.y+ball.r-b.y,fB=b.y+BH-(ball.y-ball.r);
      if(Math.min(fL,fR)<Math.min(fT,fB))ball.dx*=-1;else ball.dy*=-1;break;
    }
  }
  if(ball.y-ball.r>H){lives--;document.getElementById('livesEl').textContent='\u2665 '.repeat(Math.max(0,lives)).trim()||'x';if(lives<=0){over=true;return;}resetBall();}
  if(bricks.every(b=>!b.alive))win=true;
}

function draw(){
  if(currentBg&&currentBg.complete&&currentBg.naturalWidth>0){
    const iW=currentBg.naturalWidth,iH=currentBg.naturalHeight,scale=Math.max(W/iW,H/iH),dw=iW*scale,dh=iH*scale;
    ctx.drawImage(currentBg,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.fillStyle='rgba(10,20,15,0.38)';ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle='#1e3d2f';ctx.fillRect(0,0,W,H);
  }
  for(let b of bricks){
    if(!b.alive)continue;
    ctx.globalAlpha=0.85;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,BW,BH,3);ctx.fill();
    ctx.globalAlpha=0.2;ctx.fillStyle='#fff';ctx.fillRect(b.x+2,b.y+2,BW-4,4);
    ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(b.x,b.y,BW,BH,3);ctx.stroke();
  }
  ctx.globalAlpha=0.92;
  ctx.fillStyle=spinEffect>0?'#f5d76e':spinEffect<0?'#8fd4c2':'rgba(255,255,255,0.88)';
  ctx.beginPath();ctx.roundRect(pad.x,pad.y,pad.w,pad.h,6);ctx.fill();
  ctx.globalAlpha=1;
  if(spinEffect!==0){ctx.strokeStyle=spinEffect>0?'rgba(245,215,110,0.6)':'rgba(143,212,194,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+5,0,Math.PI*2);ctx.stroke();}
  const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);
  g.addColorStop(0,'#fff7a0');g.addColorStop(1,'#c8a020');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  if(!started&&!over&&!win&&!quoteVisible){
    ctx.fillStyle='rgba(0,0,0,0.52)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5ecd0';ctx.font='bold 22px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('E I D O S',W/2,H/2-16);
    ctx.font='13px sans-serif';ctx.fillStyle='#c8c8b0';
    ctx.fillText('Mueve el rat\u00f3n o toca para empezar',W/2,H/2+14);
    ctx.textAlign='left';
  }
}

let running=false;
function loop(){
  if(running)return;running=true;
  function frame(){
    if(quoteVisible){running=false;return;}
    if(over||win){
      running=false;draw();
      const msg=document.getElementById('msg'),btn=document.getElementById('game-btn');
      if(win){const qi=level-1;level++;if(qi<QUOTES.length){showQuote(qi);}else{nextLevel();}}
      else{msg.textContent='Game over - '+score+' puntos';btn.textContent='Reiniciar';btn.onclick=restart;btn.style.display='inline-block';}
      return;
    }
    update();draw();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

currentBg=bgImgs[0];initBricks(1);loop();
</script>
</body>
</html>
