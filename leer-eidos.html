  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

      try {
        const saved = JSON.parse(localStorage.getItem('ga_consent_v2') || '{}');
        return saved.analytics_storage === 'granted';
      } catch(e){
        return false;
      }
    }

    gtag('js', new Date());
    gtag('config', 'G-SCSFPYKJTX', { send_page_view: true });

    if (hasAnalyticsConsent()) {
      try {
        localStorage.setItem('opened_chapter_eidos', 'yes');
        gtag('event', 'chapter_open', {
          book: 'eidos'
        });
      } catch(e){}
    }
  </script>
