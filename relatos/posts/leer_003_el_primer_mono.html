  <button class="share-pdf-btn" type="button" onclick="sharePdfPage()">Compartir</button>
  <div id="sharePdfMsg" class="share-pdf-msg">Enlace copiado</div>

  <iframe
    src="../img/posts/post_003/files/el_primer_mono.pdf"
    style="position:fixed; top:0; left:0; width:100%; height:100%; border:none;"
    width="100%"
    height="100%">
  </iframe>

  <script>
    async function sharePdfPage() {
      const title = document.body.dataset.pdfTitle || document.title || 'Eidos';
      const description = document.body.dataset.shareDescription || title;
      const shareUrl = document.body.dataset.shareUrl || window.location.href;
      const isWebPage = location.protocol === 'http:' || location.protocol === 'https:';

      if (isWebPage && navigator.share) {
        try {
          await navigator.share({ title, text: description, url: shareUrl });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      if (copyTextWithoutPermission(shareUrl)) {
        showShareMessage('Enlace copiado');
        return;
      }

      if (isWebPage && navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          showShareMessage('Enlace copiado');
          return;
        } catch (err) {
        }
      }

      showShareMessage('No se pudo copiar el enlace');
    }

    function copyTextWithoutPermission(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange(0, temp.value.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }

      temp.remove();
      return copied;
    }

    function showShareMessage(text) {
      const msg = document.getElementById('sharePdfMsg');
      if (!msg) return;
      msg.textContent = text;
      msg.style.display = 'block';
      clearTimeout(window.__sharePdfTimer);
      window.__sharePdfTimer = setTimeout(() => {
        msg.style.display = 'none';
      }, 1800);
    }
  </script>
